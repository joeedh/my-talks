name: Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

# what actions/deploy-pages needs
permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; don't cancel one mid-flight
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # apt's pandoc is far too old for --syntax-highlighting; pin the release
      # instead, so CI renders the same deck the local build does
      - name: Install pandoc
        env:
          PANDOC_VERSION: 3.9.0.2
        run: |
          curl -fsSL -o pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i pandoc.deb
          pandoc --version | head -1

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # google-chrome ships with the runner image; if it ever stops doing so,
      # build.py warns and drops the PDFs rather than failing the site build
      - name: Build site
        run: python build.py --site --pdf

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
