<script>
// Injected by build.py via --include-after-body, i.e. immediately after the
// Reveal.initialize() call that pandoc's template emits.
(function () {
  var printing = /print-pdf/.test(window.location.search);

  // Persistent corner QR code, linking back to this talk's repo folder. It's
  // a fixed-position element outside .slides, so it survives every slide
  // transition without touching the deck markdown. Skipped when printing --
  // a static PDF page doesn't benefit from a scannable link, and it would
  // otherwise sit on top of content in the print layout.
  if (!printing) {
    var qr = document.createElement('a');
    qr.id = 'qr-corner';
    qr.href = 'https://github.com/joeedh/my-talks/tree/master/2026/09-codium-consortium';
    qr.target = '_blank';
    qr.rel = 'noopener';
    qr.title = 'github.com/joeedh/my-talks/tree/master/2026/09-codium-consortium';
    qr.innerHTML = '<img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAYYAAAGGAQAAAABX+xtIAAADJElEQVR4nO1cUW6kMAx9CUj7CVIP0KOkN9gj7Zn2BnCgSsxnJZArx3EC8wWV2mYy9geFEquTvjjxe07GEa7Z5i86AOZR1/8KNOU7WjqiCR0BA7GtQOCf07Bqo2E1BM+br9IDNCm+cuEhoJeO4jhAkLeCfp398OZx3kiCeEhwx7sU5wp3eUuGeWsjcSACbj1oujmH+XUFZtcDYfnNT3XK/LlmO3tej/7umeY3wIVlhAP6FeH/y4p5fP/ZT+XN45sx7zh33wDcHCdtYLi7FfPfBcTB7sKyyYuv/Q1vHrXF+c3pw/De0zzy5fXDEbD1cuE4d6mJIfjwox2Sj0tSLjRNeVlg6ia5vKT2kt/X2Q9vHueNMvmWRF0SOb5Ehhaz9cjU2QzzFkYiShAnXsbBzom6DIZ0R6VJnf3w5vEVHQ5Cw2OcIysxStNIXpgm8/gjEaK4ShBHEUaUmAg8shzTye9Mk2kEc0pK22FG7w7reX5hcd4G5ktO3vPavZ/gy1IezdbzlmosYJALYdPBoGGP9KLOfnjzuD63U8rbU1El0fVUcFMSZ+t5CyMReyUmZea7NV7y9lxcg8V5E5iTzt7R9rVUzeWPlXT/A5/Km8e3czXkaqkKb3FuL9k6yaPFeVPaa6esXISZ/bSesrmFI95yuBYwJwGU75Waq05zlGJhentLmCMV0WMkHypstp43y88nydbzsq1MfafSwfg52vHYnPsnqsvmVGDfHMLCj8UGkWfr7cc180/rgaS4arZ+KJ6W8sqaq27G1RrAfMqreFnZpbxyt56TiDV19sObx3mjsjVCJNZsKYPXdpSC3f67581X6QHdC1GOKOXJnK1M62T8HE1pMkH4uebtx40T5YAL2dzeBObFBG49uaZyzIGzB1vPGzuXSilvv6ufC3ufrK6GZjyGCDafTRsBOaUWQ5wf3Zs06/gg2x+quh8XzT+tBw7nUnU7zH6CzzYYP2/xXOqHEwluHjP6WmmlyeIcjcZ50N0TuuU1f+3Ews2Nn7eBOcl6rkiXRJ2tsHdY/bwZzHF3p/ugyndPlI3vsDh/fMydfW/UaasTwesen/a+PWyZ0sEYAAAAAElFTkSuQmCC" alt="QR code linking to this talk\'s repo folder">';
    document.body.appendChild(qr);
  }

  if (printing) {
    // reveal's Print.activate() sequences itself with
    // `await new Promise(requestAnimationFrame)`. Headless Chrome under
    // --virtual-time-budget doesn't reliably produce the compositor frames
    // those hops wait on, so activation stalls, `loading-scroll-mode` keeps
    // every slide hidden, and the PDF comes out as one blank page.
    //
    // Timers *are* driven by virtual time, so rAF is redirected onto one for
    // the print pass only. Nothing animates while printing, so ordering is all
    // reveal actually wants here.
    window.requestAnimationFrame = function (cb) {
      return window.setTimeout(function () { cb(performance.now()); }, 0);
    };
    window.cancelAnimationFrame = window.clearTimeout;

    // Reveal.configure() re-evaluates the view mode and would drop back out of
    // print layout, so the options below are skipped while printing.
    return;
  }

  // Pandoc's reveal.js template only forwards a fixed allowlist of options, so
  // anything outside it has to be applied after initialize().
  //
  // navigationMode:'linear' is the important one. Pandoc turns every `##` act
  // into a *vertical* stack, which means left/right would jump act-to-act and
  // skip their contents. Linear mode makes the arrows walk every slide in order.
  function apply() {
    Reveal.configure({
      navigationMode: 'linear',
      slideNumber: 'c/t',
      pdfSeparateFragments: false
    });

    // reveal fits its fixed-size slide to the CSS-pixel size of `.reveal`
    // (its own layout() takes no arguments -- it always re-measures
    // `.reveal`'s offsetWidth/offsetHeight itself, so there's no hook to feed
    // it a corrected size). Browser zoom shrinks that CSS-pixel box (fewer
    // CSS px are visible) by exactly the zoom factor, so reveal scales the
    // deck back up to fill it -- zoom and reveal's own re-fit cancel out and
    // the deck never visibly grows.
    //
    // Since reveal's measurement can't be intercepted, compensate a layer
    // above it instead: wrap `.reveal` in a plain div and apply our own
    // `transform: scale()` to that wrapper. A CSS transform doesn't change
    // offsetWidth/offsetHeight, so reveal keeps computing its fit from the
    // unscaled box underneath -- our wrapper's scale rides on top of that,
    // unopposed, the same way zoom would on an ordinary (non-reveal) page.
    var reveal = document.querySelector('.reveal');
    var zoomWrap = document.createElement('div');
    zoomWrap.id = 'zoom-compensator';
    reveal.parentNode.insertBefore(zoomWrap, reveal);
    zoomWrap.appendChild(reveal);

    var baseDPR = window.devicePixelRatio;
    function applyZoomCompensation() {
      zoomWrap.style.transform = 'scale(' + (window.devicePixelRatio / baseDPR) + ')';
    }
    applyZoomCompensation();

    // There's no native "devicePixelRatio changed" event, so re-arm a
    // matchMedia listener tuned to the current ratio each time it fires --
    // the standard cross-browser way to detect zoom.
    function watchZoom() {
      var mq = window.matchMedia('(resolution: ' + window.devicePixelRatio + 'dppx)');
      mq.addEventListener('change', function () { applyZoomCompensation(); watchZoom(); }, { once: true });
    }
    watchZoom();
  }
  if (typeof Reveal === 'undefined') return;
  if (Reveal.isReady && Reveal.isReady()) apply();
  else Reveal.on('ready', apply);
})();
</script>

<style>
/* The cover art already carries the title, author and venue, so the pandoc
   template's own text would just sit on top of it. */
#title-slide[data-background-image] > * { display: none }

/* ---- palette -------------------------------------------------------------
   The deck reads as paper, not as a lightbox. reveal's white theme pairs #fff
   with #222, which is nearly as harsh as the white-on-black it replaced; a warm
   off-white ground and dark slate ink land around 11:1 -- still well past AA at
   projector distance, without the glare. */
:root {
  --r-background-color: #faf8f5;
  --r-main-color:       #33383d;
  --r-heading-color:    #1f2933;
  --r-link-color:       #2a6496;
  --r-link-color-hover: #4a90c4;
  --r-selection-background-color: #d5e3f0;
  --r-selection-color:  #1f2933;
}
.reveal, .reveal .slides section { color: var(--r-main-color) }
.reveal h1, .reveal h2, .reveal h3, .reveal h4 { color: var(--r-heading-color) }

/* ---- type ----------------------------------------------------------------
   Source Sans Pro is narrow and small on the eye at the back of a room. These
   are faces already installed on the machine, so nothing is downloaded and
   nothing breaks when presenting offline. */
:root {
  --r-main-font: "Segoe UI Variable Text", "Segoe UI", -apple-system,
                 BlinkMacSystemFont, system-ui, "Helvetica Neue", Arial, sans-serif;
  --r-heading-font: "Segoe UI Variable Display", "Segoe UI", -apple-system,
                    BlinkMacSystemFont, system-ui, "Helvetica Neue", Arial, sans-serif;
  --r-code-font: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas,
                 "DejaVu Sans Mono", monospace;
  --r-main-font-size: 40px;
  /* reveal's themes upcase every heading. Headers here are written as
     sentences and read as shouting in caps; keep them as authored. */
  --r-heading-text-transform: none;
}
.reveal .slides section { line-height: 1.35; font-weight: 400 }
.reveal h1, .reveal h2, .reveal h3, .reveal h4 { letter-spacing: -0.01em }

.reveal .slides section li {
  margin-bottom: 0.4em;
  line-height: 1.1;
}

/* ---- code ----------------------------------------------------------------
   The `tango` highlight style grounds blocks in #f8f8f8, which is invisible
   against the page. Give them their own tint and a hairline edge instead. */
.reveal div.sourceCode, .reveal pre:not(.sourceCode) {
  background: #f2efe9;
  border: 1px solid #e2ddd4;
  border-radius: 4px;
  box-shadow: none;
}
/* pandoc wraps highlighted blocks in div.sourceCode > pre.sourceCode; framing
   both draws a box inside a box. */
.reveal div.sourceCode pre {
  background: transparent;
  border: none;
  box-shadow: none;
  margin: 0;
}
.reveal pre code { background: transparent; padding: 12px 16px }

/* Highlighted inline spans are bare <code>, not <pre><code>, so reveal's
   code styling doesn't reach them. Token colors come from pandoc's own
   `code span.*` rules, the same ones the fenced blocks use. */
.reveal code.sourceCode, .reveal p > code, .reveal li > code {
  font-family: var(--r-code-font);
  font-size: 0.9em;
}

/* ---- corner QR code --------------------------------------------------
   Fixed outside .slides so it stays put across every slide, including the
   title slide's dark cover art -- hence the white card behind it. */
#qr-corner {
  position: fixed;
  left: 14px;
  bottom: 14px;
  z-index: 30;
  display: block;
  background: #fff;
  padding: 4px;
  border-radius: 4px;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
  line-height: 0;
}
#qr-corner img {
  display: block;
  width: 128px;
  height: 128px;
}

/* ---- zoom compensation -----------------------------------------------
   Wraps .reveal so browser-zoom changes can scale the deck without reveal's
   own viewport-fit layout measuring (and cancelling) the zoom. See the
   zoom-compensator script above. */
#zoom-compensator {
  width: 100%;
  height: 100%;
  transform-origin: 50% 50%;
}
</style>
